<!DOCTYPE html>
<html>
<head>
    <title>AI Study Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📚 AI Study Planner</h1>
        <p>Plan your studies. Track your progress.</p>
    </header>

    <main>

        <section class="welcome">
            <h2>Welcome, Student! 👋</h2>
            <p>Organize your study schedule easily.</p>
        </section>

        <section class="cards">

            <div class="card">
                <h3>📅 Today's Tasks</h3>
                <p>Complete your daily study tasks.</p>
                <button>View Tasks</button>
            </div>

            <div class="card">
                <h3>⏰ Study Schedule</h3>
                <p>Plan your study time.</p>
                <button>View Schedule</button>
            </div>

            <div class="card">
                <h3>📊 Progress</h3>
                <p>Track your learning progress.</p>
                <button>View Progress</button>
            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 AI Study Planner</p>
    </footer>

</body>
</html>
